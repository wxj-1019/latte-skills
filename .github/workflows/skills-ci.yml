name: skills-ci

on:
  push:
    paths:
      - "**/SKILL.md"
      - "**/*.md"
      - "**/*.ps1"
      - "**/*.py"
      - "**/*.mjs"
      - ".github/workflows/skills-ci.yml"
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Non-blocking: produces PR annotations for agent-config issues.
      # Strict mode is intentionally NOT used here — upstream docs contain
      # angle-bracket placeholders that agnix flags as false positives.
      - name: Lint agent configs (annotations only)
        uses: agent-sh/agnix@v0
        with:
          target: "claude-code"
        continue-on-error: true

      # Blocking gate: deterministic structural checks shared with local dev.
      - name: Hard gate — skill structure
        run: pwsh -File scripts/check-skills.ps1
